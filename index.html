<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Гоплит против Луны 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&display=swap">
<style>
/* layout: a screening room. The picture sits centred on black; under it one row of transport controls and one row of camera and speed switches.
   With the viewer's own camera the picture takes the whole room instead of a 16:9 frame. */
:root {
  --night: #05060f; --plate: rgba(16, 20, 48, 0.9); --line: rgba(140, 130, 255, 0.4);
  --shade: rgba(5, 6, 15, 0.82); --ink: #eef0ff; --dim: #a9afd8; --pink: #ff5fc8; --pink-soft: rgba(255, 95, 200, 0.24); --moon: #cfe0ff;
  --ui: "Exo 2", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--ui); overflow: hidden; display: flex; flex-direction: column; }
.stage { position: relative; flex: 1 1 auto; min-height: 0; display: grid; place-items: center; container-type: size; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#gl { display: block; aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 150px) * 16 / 9)); width: min(100cqw, 100cqh * 16 / 9); max-width: 100%; max-height: 100%; background: var(--night); outline: none; touch-action: none; }
body.free #gl { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; aspect-ratio: auto; cursor: grab; }
body.free #gl:active { cursor: grabbing; }
#hint { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 8px; text-align: center; font-size: 12px; font-weight: 500; color: var(--ink); text-wrap: balance; background: linear-gradient(transparent, var(--shade)); pointer-events: none; transition: opacity 0.6s; }
#hint.gone { opacity: 0; }

.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px 12px; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.opts { flex-wrap: wrap; padding-block: 10px 14px; gap: 8px 18px; }
button { font-family: var(--ui); cursor: pointer; }
#play { font-weight: 800; font-size: 14px; line-height: 1; letter-spacing: 0.06em; text-transform: uppercase; color: var(--night); background: var(--pink); border: 0; padding: 13px 18px; min-width: 8.5em; clip-path: polygon(9px 0, 100% 0, calc(100% - 9px) 100%, 0 100%); }
#play:hover { background: var(--moon); }
.sq, .seg button { font-weight: 700; font-size: 13px; line-height: 1; color: var(--ink); background: var(--plate); border: 1px solid var(--line); min-height: 38px; padding: 0 12px; clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%); }
.sq { font-size: 18px; min-width: 40px; padding: 0 0 2px; }
.sq:hover, .seg button:hover { border-color: var(--moon); }
.seg button[aria-pressed="true"] { background: var(--pink-soft); border-color: var(--pink); }
button:focus-visible, #seek:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; }
#seek { flex: 1 1 auto; min-width: 0; accent-color: var(--pink); }
#clock { font-size: 13px; font-weight: 500; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.seg { display: flex; align-items: center; gap: 6px; }
.lab { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin-right: 2px; }
#quiet { font-size: 12px; font-weight: 500; color: var(--dim); }
.name { margin-left: auto; font-size: 13px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
.name b { color: var(--pink); } .name i { color: var(--moon); font-style: normal; }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--night); color: var(--ink); font-size: 15px; }
body.render { display: block; } body.render .bar, body.render #hint { display: none; } body.render .stage { height: 100%; padding: 0; } body.render #gl { width: 100%; height: 100%; aspect-ratio: auto; }
@media (max-width: 860px) { .name { display: none; } }
@media (max-width: 620px) { .bar { flex-wrap: wrap; gap: 8px; } #seek { order: 5; flex: 1 0 100%; height: 28px; } #clock { margin-left: auto; } #play { min-width: 7.4em; padding-inline: 14px; } .opts { gap: 8px 12px; } .seg button { padding: 0 10px; } }
@media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <canvas id="gl" tabindex="0" aria-label="Сцена боя: кибергоплит против Луны"></canvas>
  <p id="hint" hidden>Тяните, чтобы вращать · колесо или щипок приближает · правая кнопка или два пальца сдвигают</p>
</div>
<div class="bar">
  <button id="play" type="button">Смотреть</button>
  <button id="prev" class="sq" type="button" aria-label="Кадр назад" title="Кадр назад (←)">‹</button>
  <button id="next" class="sq" type="button" aria-label="Кадр вперёд" title="Кадр вперёд (→)">›</button>
  <input id="seek" type="range" min="0" max="15.4" step="0.01" value="0" aria-label="Перемотка">
  <span id="clock">0,00 с</span>
</div>
<div class="bar opts">
  <div class="seg" role="group" aria-label="Камера">
    <span class="lab">Камера</span>
    <button id="cam-film" type="button" aria-pressed="true" title="Камера фильма (C)">Кино</button>
    <button id="cam-free" type="button" aria-pressed="false" title="Своя камера (C)">Своя</button>
  </div>
  <div class="seg" id="views" role="group" aria-label="Ракурс своей камеры" hidden>
    <span class="lab">Вести</span>
    <button type="button" data-view="both" aria-pressed="false">Обоих</button>
    <button type="button" data-view="hoplite" aria-pressed="false">Гоплита</button>
    <button type="button" data-view="luna" aria-pressed="false">Луну</button>
    <button type="button" data-view="top" aria-pressed="false">Сверху</button>
  </div>
  <div class="seg" id="rates" role="group" aria-label="Скорость">
    <span class="lab">Скорость</span>
    <button type="button" data-rate="1" aria-pressed="true">1×</button>
    <button type="button" data-rate="0.5" aria-pressed="false">½</button>
    <button type="button" data-rate="0.25" aria-pressed="false">¼</button>
    <span id="quiet" hidden>без звука</span>
  </div>
  <span class="name"><b>Гоплит</b> против <i>Луны</i></span>
</div>
<div id="fail" hidden><span>Не получилось запустить 3D: в этом браузере недоступен WebGL. Откройте страницу в Chrome или Safari.</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/ConvexGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Reflector.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
const T = THREE;
const D = Math.PI / 180;
const v3 = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);
const col = (hex, k = 1) => new T.Color(hex).convertSRGBToLinear().multiplyScalar(k);
let ENV = null;

// ---------- materials
function std(hex, o = {}) {
  return new T.MeshStandardMaterial(Object.assign({ color: col(hex), flatShading: true, metalness: 0.65, roughness: 0.45, envMapIntensity: 1 }, o));
}
// light: unlit and brighter than white, so only it blooms
function glow(hex, k = 2.4) {
  return new T.MeshBasicMaterial({ color: col(hex, k), toneMapped: false, fog: false });
}

// ---------- geometry
function hull(pts, mirror = true) {
  const P = [];
  for (const p of pts) {
    P.push(v3(p[0], p[1], p[2]));
    if (mirror && Math.abs(p[0]) > 1e-6) P.push(v3(-p[0], p[1], p[2]));
  }
  return new T.ConvexGeometry(P);
}
/** A tapered prism hanging from the joint down −Y. */
function limb(rTop, rBot, len, seg = 6, sz = 1, turn = 0) {
  const g = new T.CylinderGeometry(rTop, rBot, len, seg, 1);
  g.translate(0, -len / 2, 0);
  if (turn) g.rotateY(turn);
  if (sz !== 1) g.scale(1, 1, sz);
  return g;
}
const cyl = (r, h, seg = 8, r2 = r) => new T.CylinderGeometry(r2, r, h, seg, 1);
const box = (w, h, d) => new T.BoxGeometry(w, h, d);
/** A cylinder lying along X (a servo drum, a ring). */
function drum(r, w, seg = 10) {
  const g = new T.CylinderGeometry(r, r, w, seg, 1);
  g.rotateZ(Math.PI / 2);
  return g;
}
/** A cylinder along Z. */
function rodZ(r, len, seg = 6, r2 = r) {
  const g = new T.CylinderGeometry(r2, r, len, seg, 1);
  g.rotateX(Math.PI / 2);
  return g;
}
/** A thick curved plate: the band r1…r2 between angles a0…a1 (radians, in the XY plane), `depth` along Z. */
function arcPlate(r1, r2, a0, a1, depth, segs = 6) {
  const s = new T.Shape();
  s.absarc(0, 0, r2, a0, a1, false);
  s.absarc(0, 0, r1, a1, a0, true);
  const g = new T.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: segs });
  g.translate(0, 0, -depth / 2);
  return g;
}
function tube(pts, r, seg = 6, n = 24) {
  const c = new T.CatmullRomCurve3(pts.map((p) => v3(p[0], p[1], p[2])));
  return new T.TubeGeometry(c, n, r, seg, false);
}
function add(parent, geo, mat, p, r, s) {
  const m = new T.Mesh(geo, mat);
  if (p) m.position.set(p[0], p[1], p[2]);
  if (r) m.rotation.set(r[0], r[1], r[2]);
  if (s) typeof s === 'number' ? m.scale.setScalar(s) : m.scale.set(s[0], s[1], s[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function grp(parent, p, name) {
  const g = new T.Group();
  if (p) g.position.set(p[0], p[1], p[2]);
  if (name) g.name = name;
  if (parent) parent.add(g);
  return g;
}

// ---------- posing
const _m = new T.Matrix4();
const _q = new T.Quaternion();
const _pq = new T.Quaternion();
/** Turn a bone so its −Y runs along `dirW` and its +Z looks toward `poleW` (world directions). */
function aim(g, dirW, poleW) {
  const y = dirW.clone().normalize().negate();
  let z = poleW.clone().addScaledVector(y, -poleW.dot(y));
  if (z.lengthSq() < 1e-8) z = v3(1, 0, 0).addScaledVector(y, -y.x);
  z.normalize();
  const x = v3().crossVectors(y, z);
  _m.makeBasis(x, y, z);
  _q.setFromRotationMatrix(_m);
  g.parent.updateWorldMatrix(true, false);
  g.parent.getWorldQuaternion(_pq);
  g.quaternion.copy(_pq.invert().multiply(_q));
  g.updateWorldMatrix(false, true);
}
/** Two-bone IK: the upper bone at its joint, the lower hanging from it; the end reaches `targetW`, the middle joint bends toward `poleW`. */
function ik2(upper, lower, L1, L2, targetW, poleW) {
  upper.parent.updateWorldMatrix(true, false);
  upper.updateWorldMatrix(false, false);
  const H = upper.getWorldPosition(v3());
  const to = targetW.clone().sub(H);
  const dir = to.clone().normalize();
  const d = Math.min(Math.max(to.length(), Math.abs(L1 - L2) + 1e-4), L1 + L2 - 1e-4);
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const perp = poleW.clone().addScaledVector(dir, -poleW.dot(dir)).normalize();
  const K = H.clone().addScaledVector(dir, a).addScaledVector(perp, h);
  const end = H.clone().addScaledVector(dir, d);
  aim(upper, K.clone().sub(H), perp);
  aim(lower, end.clone().sub(K), perp);
  return { K, end };
}
function setWorldQuat(g, qW) {
  g.parent.updateWorldMatrix(true, false);
  g.parent.getWorldQuaternion(_pq);
  g.quaternion.copy(_pq.invert().multiply(qW));
}
/** Soft radial dot for sprites and halos. */
function dotTexture(stops, size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, s] of stops) g.addColorStop(o, s);
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);
  const t = new T.CanvasTexture(c);
  t.encoding = T.sRGBEncoding;
  return t;
}
function rng(seed) {
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

/** The game's dark contour in 3D: every solid part gets a slightly larger back-facing shell in the outline colour. */
function addOutlines(root, t = 0.011, hex = 0x0b0d26) {
  const mat = new T.ShaderMaterial({
    side: T.BackSide, fog: false,
    uniforms: { t: { value: t }, c: { value: col(hex) } },
    vertexShader: 'uniform float t; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); mv.xyz += normalize(normalMatrix * normal) * t; gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.0); }',
  });
  const list = [];
  root.traverse((o) => { if (o.isMesh && o.material.isMeshStandardMaterial && o.material.side !== T.DoubleSide) list.push(o); });
  for (const o of list) {
    let g = o.geometry.clone();
    g.deleteAttribute('normal'); g.deleteAttribute('uv');
    g = T.BufferGeometryUtils.mergeVertices(g, 1e-4);
    g.computeVertexNormals();
    const m = new T.Mesh(g, mat);
    m.userData.outline = true;
    m.layers.set(1); // the main camera only: not in the floor's mirror
    o.add(m);
  }
  return list.length;
}

const FIST_Y = 0.065;
/** A hand closed around a shaft that runs along its local Z through (0, −FIST_Y·s, 0); −Y continues the forearm. */
function fist(parent, mFinger, mPlate, s = 1) {
  const g = grp(parent), cy = -FIST_Y * s, R = 0.037 * s;
  add(g, box(0.074 * s, 0.05 * s, 0.104 * s), mPlate, [0, -0.012 * s, 0]);
  for (let f = 0; f < 4; f++) {
    const z = (f - 1.5) * 0.0255 * s;
    for (let k = 0; k < 5; k++) { const a = (-152 + k * 63) * D; add(g, box(0.038 * s, 0.018 * s, 0.022 * s), k === 1 || k === 2 ? mPlate : mFinger, [Math.sin(a) * R, cy + Math.cos(a) * R, z], [0, 0, -a]); }
  }
  for (const [a, r] of [[-165, 1.0], [150, 1.05]]) add(g, box(0.034 * s, 0.018 * s, 0.026 * s), mFinger, [Math.sin(a * D) * R * r, cy + Math.cos(a * D) * R * r, 0.064 * s], [0, 0.35, -a * D]);
  return g;
}
/** Turn a hand so that its grip (local Z) lies along `axisW` while it still continues its forearm as nearly as it can. */
function orientGrip(hand, lo, axisW) {
  lo.updateWorldMatrix(true, false);
  const z = axisW.clone().normalize(), y = v3(0, 1, 0).applyQuaternion(lo.getWorldQuaternion(new T.Quaternion()));
  y.addScaledVector(z, -y.dot(z));
  if (y.lengthSq() < 1e-6) y.set(0, 1, 0).addScaledVector(z, -z.y);
  y.normalize();
  setWorldQuat(hand, new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(v3().crossVectors(y, z), y, z)));
  hand.updateWorldMatrix(false, true);
}

// When things happen, in seconds. Shared by the picture (film.js) and the sound (sfx/mixfilm.cjs).
var EV = {
  headTurn: 1.25, eye3: 2.2, eye4: 2.5, click: 2.95, draw: 3.0, drawEnd: 3.3, kamae: 3.56, visor: 3.66, steps: [4.12, 4.42, 4.68, 4.92],
  cut1: 5.07, slowEnd: 5.9, skidEnd: 6.5,
  thrust1: 7.34, thrust2: 7.91, floor: 7.96, cut2: 8.3, bash: 8.52, slash: 9.14, crescents: [9.3, 9.38, 9.46, 9.54, 9.62],
  falls: [10.3, 10.62, 10.94], floor3: 11.03, release: 11.38, cut: 11.64, clatter: [11.97, 12.13], form: 11.85, lock: 12.47,
  dash: 12.5, dashSteps: [12.72, 12.95], clash: 13.12, freeze: 13.2, pullEnd: 13.8, end: 15.0, fadeEnd: 15.4,
  shots: [0, 2.0, 3.6, 5.0, 7.0, 10.0, 12.5], hitStop: 0.07,
};
if (typeof module !== 'undefined') module.exports = EV;

// The roof of the Sky Castle at night: a round duelling floor above the clouds, towers behind, a huge moon.
const FLOOR_R = 11;
const MOON_POS = v3(34, 27, -150);
const MOON_R = 15;

function makeEnv(renderer) {
  const s = new T.Scene();
  const g = new T.SphereGeometry(60, 24, 12);
  const c = [];
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const h = p.getY(i) / 60;
    const top = [0.02, 0.03, 0.1], hor = [0.2, 0.13, 0.42], bot = [0.03, 0.02, 0.07];
    const a = h > 0 ? hor.map((v, k) => v + (top[k] - v) * Math.min(1, h * 1.6)) : hor.map((v, k) => v + (bot[k] - v) * Math.min(1, -h * 3));
    c.push(a[0], a[1], a[2]);
  }
  g.setAttribute('color', new T.Float32BufferAttribute(c, 3));
  s.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
  const panel = (x, y, z, sz, r, gg, b) => {
    const m = new T.Mesh(new T.SphereGeometry(sz, 12, 8), new T.MeshBasicMaterial({ color: new T.Color(r, gg, b) }));
    m.position.set(x, y, z);
    s.add(m);
  };
  const md = MOON_POS.clone().normalize().multiplyScalar(45);
  panel(md.x, md.y, md.z, 7, 7, 7.6, 9.5); // the moon
  panel(-34, 6, 22, 9, 2.2, 0.35, 1.6); // magenta from the hero's side
  panel(34, 3, 26, 9, 0.25, 1.2, 2.2); // cyan from the other
  panel(0, 26, 40, 12, 0.7, 0.6, 1.8); // violet from the front, above
  const pm = new T.PMREMGenerator(renderer);
  const tex = pm.fromScene(s, 0.035).texture;
  pm.dispose();
  return tex;
}

function buildWorld(scene, hdr) {
  const R = rng(11);
  const world = grp(scene, null, 'world');

  // ---- sky
  const sky = new T.Mesh(
    new T.SphereGeometry(500, 32, 16),
    new T.ShaderMaterial({
      side: T.BackSide, depthWrite: false, fog: false,
      vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `varying vec3 vP;
        void main(){
          float h = vP.y;
          vec3 top = vec3(0.004, 0.007, 0.030), mid = vec3(0.014, 0.022, 0.095), hor = vec3(0.075, 0.050, 0.200), low = vec3(0.012, 0.012, 0.050);
          vec3 c = mix(hor, mid, smoothstep(0.0, 0.22, h));
          c = mix(c, top, smoothstep(0.18, 0.85, h));
          c = mix(c, low, smoothstep(0.0, -0.25, h));
          gl_FragColor = vec4(c, 1.0);
        }`,
    }),
  );
  world.add(sky);

  // ---- stars
  {
    const n = 1400, pos = [], cl = [];
    for (let i = 0; i < n; i++) {
      const a = R() * Math.PI * 2, h = Math.pow(R(), 0.7) * 0.95 + 0.03, r = Math.sqrt(1 - h * h);
      pos.push(Math.cos(a) * r * 460, h * 460, Math.sin(a) * r * 460);
      const k = 0.5 + Math.pow(R(), 3) * 2.4, tint = R();
      cl.push(k * (0.8 + 0.2 * tint), k * 0.88, k * (1.0 - 0.15 * tint));
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new T.Float32BufferAttribute(cl, 3));
    world.add(new T.Points(g, new T.PointsMaterial({ size: 1.7, sizeAttenuation: false, vertexColors: true, toneMapped: false, fog: false, depthWrite: false })));
  }

  // ---- the moon
  let moon, halo;
  {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const x = c.getContext('2d');
    x.beginPath();
    x.arc(256, 256, 254, 0, 7);
    x.clip();
    const g = x.createRadialGradient(200, 190, 20, 256, 256, 260);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, '#e6edff');
    g.addColorStop(1, '#a9bbee');
    x.fillStyle = g;
    x.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 22; i++) {
      const cx = 60 + R() * 392, cy = 60 + R() * 392, r = 10 + R() * R() * 70;
      const cg = x.createRadialGradient(cx, cy, 0, cx, cy, r);
      cg.addColorStop(0, 'rgba(110,130,200,0.30)');
      cg.addColorStop(0.7, 'rgba(110,130,200,0.16)');
      cg.addColorStop(1, 'rgba(110,130,200,0)');
      x.fillStyle = cg;
      x.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    const tex = new T.CanvasTexture(c);
    tex.encoding = T.sRGBEncoding;
    moon = new T.Mesh(new T.CircleGeometry(MOON_R, 72), new T.MeshBasicMaterial({ map: tex, color: new T.Color(1.35, 1.35, 1.45), toneMapped: false, fog: false, transparent: true }));
    moon.position.copy(MOON_POS);
    moon.lookAt(0, 2, 6);
    world.add(moon);
    halo = new T.Sprite(new T.SpriteMaterial({ map: dotTexture([[0, 'rgba(170,190,255,0.34)'], [0.28, 'rgba(140,160,255,0.12)'], [0.6, 'rgba(120,120,255,0.04)'], [1, 'rgba(100,100,255,0)']], 256), blending: T.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false }));
    halo.position.copy(MOON_POS).multiplyScalar(1.01);
    halo.scale.setScalar(MOON_R * 6.5);
    world.add(halo);
  }

  // ---- the sea of clouds
  {
    const tex = dotTexture([[0, 'rgba(255,255,255,0.9)'], [0.4, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']], 128);
    for (let i = 0; i < 90; i++) {
      const a = R() * Math.PI * 2, r = 30 + R() * 190;
      const m = new T.SpriteMaterial({ map: tex, color: col(i % 3 ? 0x4b5cc4 : 0x8a6fe0, 0.5 + R() * 0.5), transparent: true, opacity: 0.32 + R() * 0.3, depthWrite: false, fog: false });
      const s = new T.Sprite(m);
      s.position.set(Math.cos(a) * r, -16 + R() * 10 + r * 0.02, Math.sin(a) * r);
      const w = 36 + R() * 70;
      s.scale.set(w, w * (0.16 + R() * 0.12), 1);
      world.add(s);
    }
  }

  // ---- the duelling floor: a dark mirror with a grid of light
  const mirror = {
    uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null } },
    vertexShader: T.Reflector.ReflectorShader.vertexShader,
    fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; varying vec4 vUv;
      void main(){ vec3 base = min(texture2DProj(tDiffuse, vUv).rgb, vec3(1.3)); gl_FragColor = vec4(base * color + vec3(0.003, 0.004, 0.012), 1.0); }`,
  };
  // without float render targets the mirror cannot be drawn: a plain dark floor instead
  const refl = hdr
    ? new T.Reflector(new T.CircleGeometry(FLOOR_R, 72), { textureWidth: 1024, textureHeight: 1024, color: new T.Color(0.17, 0.18, 0.28), clipBias: 0.003, multisample: 4, shader: mirror })
    : new T.Mesh(new T.CircleGeometry(FLOOR_R, 72), new T.MeshBasicMaterial({ color: new T.Color(0.006, 0.008, 0.024) }));
  refl.rotation.x = -Math.PI / 2;
  world.add(refl);
  {
    const N = 2048, PX = N / (2 * FLOOR_R), c = document.createElement('canvas');
    c.width = c.height = N;
    const x = c.getContext('2d');
    const cx = N / 2;
    x.lineCap = 'round';
    for (let i = -FLOOR_R; i <= FLOOR_R; i++) {
      const major = i % 4 === 0;
      x.strokeStyle = major ? 'rgba(150,130,255,0.75)' : 'rgba(110,110,240,0.34)';
      x.lineWidth = major ? 3.2 : 1.6;
      x.beginPath();
      x.moveTo(cx + i * PX, 0); x.lineTo(cx + i * PX, N);
      x.moveTo(0, cx + i * PX); x.lineTo(N, cx + i * PX);
      x.stroke();
    }
    // fade the grid toward the rim
    x.globalCompositeOperation = 'destination-in';
    const fade = x.createRadialGradient(cx, cx, 0, cx, cx, cx);
    fade.addColorStop(0, 'rgba(0,0,0,1)');
    fade.addColorStop(0.55, 'rgba(0,0,0,0.75)');
    fade.addColorStop(0.93, 'rgba(0,0,0,0.18)');
    fade.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = fade;
    x.fillRect(0, 0, N, N);
    x.globalCompositeOperation = 'source-over';
    const ring = (r, style, w, dash) => {
      x.strokeStyle = style; x.lineWidth = w; x.setLineDash(dash || []);
      x.beginPath(); x.arc(cx, cx, r * PX, 0, 7); x.stroke(); x.setLineDash([]);
    };
    ring(10.45, 'rgba(70,220,255,0.85)', 5);
    ring(10.1, 'rgba(70,220,255,0.3)', 2);
    ring(4.6, 'rgba(160,120,255,0.55)', 3, [26, 20]);
    const hex = (wx, wz, r, style) => {
      x.strokeStyle = style; x.lineWidth = 5; x.beginPath();
      for (let k = 0; k <= 6; k++) {
        const a = (k * Math.PI) / 3;
        const px = cx + (wx + Math.cos(a) * r) * PX, py = cx + (wz + Math.sin(a) * r * 0.9) * PX;
        k ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.stroke();
    };
    hex(-1.7, 0, 1.05, 'rgba(255,95,200,0.85)');
    hex(1.7, 0, 1.05, 'rgba(255,70,95,0.85)');
    const tex = new T.CanvasTexture(c);
    tex.encoding = T.sRGBEncoding;
    tex.anisotropy = 8;
    const grid = new T.Mesh(new T.CircleGeometry(FLOOR_R, 72), new T.MeshBasicMaterial({ map: tex, color: new T.Color(1.1, 1.1, 1.1), transparent: true, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false }));
    grid.rotation.x = -Math.PI / 2;
    grid.position.y = 0.006;
    world.add(grid);
    const sh = new T.Mesh(new T.CircleGeometry(FLOOR_R, 48), new T.ShadowMaterial({ opacity: 0.6 }));
    sh.rotation.x = -Math.PI / 2;
    sh.position.y = 0.003;
    sh.receiveShadow = true;
    world.add(sh);
  }

  // ---- stone: the platform, its parapet, the tower under it
  const stone = std(0x121632, { metalness: 0.15, roughness: 0.85 });
  const stoneL = std(0x1a1f45, { metalness: 0.15, roughness: 0.8 });
  const roofM = std(0x1e2258, { metalness: 0.3, roughness: 0.6 });
  const merge = (list) => T.BufferGeometryUtils.mergeBufferGeometries(list.map((g) => (g.index ? g.toNonIndexed() : g)));
  {
    add(world, new T.CylinderGeometry(FLOOR_R + 0.45, FLOOR_R + 0.9, 1.4, 48), stone, [0, -0.72, 0]);
    add(world, new T.CylinderGeometry(9.6, 6.5, 60, 20), stone, [0, -31, 0]);
    add(world, new T.TorusGeometry(FLOOR_R + 0.02, 0.035, 6, 120), glow(0x35e0ff, 1.0), [0, 0.03, 0], [Math.PI / 2, 0, 0]);
    const parts = [];
    const N = 40;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2, r = FLOOR_R + 0.42;

        const m = box(0.95, 0.62, 0.5);
        m.translate(0, 0.78 + 0.31, 0); m.rotateY(-a + Math.PI / 2); m.translate(Math.cos(a) * r, 0, Math.sin(a) * r);

  }

  // ---- lamp posts with the castle's wind curl

    const pillar = [], curls = [];

  // ---- crimson banners of the king
  {

  // ---- the castle behind

      body.push(b);
      const ring = new T.CylinderGeometry(r * 1.2, r * 1.05, r * 0.5, 10);
      ring.translate(x, top + r * 0.1, z);
      body.push(ring);
      const roof = new T.ConeGeometry(r * 1.28, r * 2.6, 10);
      roof.translate(x, top + r * 0.35 + r * 1.3, z);
      roofs.push(roof);
      const tipY = top + r * 0.35 + r * 2.6;
      const pole = new T.CylinderGeometry(0.06, 0.06, r * 1.1, 4);
      pole.translate(x, tipY + r * 0.5, z);
      body.push(pole);
      const f = new T.BufferGeometry();
      f.setAttribute('position', new T.Float32BufferAttribute([x, tipY + r * 1.0, z, x + r * 0.9, tipY + r * 0.82, z, x, tipY + r * 0.62, z], 3));
      f.computeVertexNormals();
      flags.push(f);
      const n = 3 + Math.floor(R() * 4);
      for (let i = 0; i < n; i++) {
        const an = Math.atan2(-z + 6, -x) + (R() - 0.5) * 1.6;
        const w = new T.PlaneGeometry(r * 0.09, r * 0.2);
        w.rotateY(-an + Math.PI / 2);
        w.translate(x + Math.cos(an) * r * 1.03, top - r * (0.6 + R() * 3.2), z - Math.sin(an) * r * 1.03 * -1);
        lit.push(w);
      }
    };
    [[-12, -26, 1.6, 4.2], [-22, -36, 2.2, 6.5], [-1.5, -52, 3.0, 8], [-36, -30, 1.7, 3.2], [-48, -58, 3.2, 10], [20, -30, 1.8, 4.6], [31, -46, 2.6, 8], [47, -64, 3.4, 11], [58, -36, 1.9, 3.5], [-78, -90, 4.5, 15], [84, -100, 4.5, 16]].forEach((t) => tower(...t));
    const wall = (x1, z1, x2, z2, top) => {
      const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz);

      w.rotateY(-Math.atan2(dz, dx));
      w.translate((x1 + x2) / 2, top - 25, (z1 + z2) / 2);

      for (let i = 0; i < L / 2.2; i++) {

    wall(-12, -26, -22, -36, 0.6); wall(-22, -36, -1.5, -52, 1.6); wall(-1.5, -52, 31, -46, 1.0); wall(31, -46, 20, -30, 0.4); wall(-36, -30, -22, -36, 0.2);

  // ---- light
  const moonL = new T.DirectionalLight(col(0xc6d4ff), 2.3);

  moonL.shadow.mapSize.set(2048, 2048);

  scene.add(fill);
  const hemi = new T.HemisphereLight(col(0x5868d8), col(0x1e1238), 0.6);
  scene.add(hemi);
  return { world, refl, moonL, fill, hemi, moon, halo };
}

  // ---- the dory: +Z runs to the point
  const spear = grp(null, null, 'dory'), pieces = [];

    const TIP = 1.72, BUTT = 0.92, FROM = 1.28, CUT = 0.5;

    add(spear, rodZ(0.017, FROM + BUTT, 6), sSteel, [0, 0, (FROM - BUTT) / 2]);

    const scan = add(holo, new T.RingGeometry(0.02, 0.085, 24), new T.MeshBasicMaterial({ color: new T.Color(3, 2.2, 3), side: T.DoubleSide, transparent: true, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false }));

    add(A.up, cyl(0.02, B.upper, 6), bone, [0, -B.upper / 2, 0]);

    add(Lg.up, box(0.005, 0.25, 0.005), crim, [0, -0.25, 0.088], [0.02, 0, 0]);

    add(Lg.lo, hull([[0.036, 0.035, 0.05], [0.03, -0.045, 0.056], [0, 0, 0.078], [0.036, 0, 0.03], [0, 0.05, 0.05], [0, -0.055, 0.055]]), lac);
    add(Lg.lo, cyl(0.02, B.shin, 6), bone, [0, -B.shin / 2, 0]);
    add(Lg.lo, cyl(0.014, 0.28, 5), bone, [0, -0.22, -0.058]);
    add(Lg.lo, cyl(0.006, 0.44, 4), gold, [0, -0.28, -0.058]);
    add(Lg.lo, hull([[0.04, -0.09, 0.046], [0.044, -0.09, -0.012], [0.032, -0.45, 0.036], [0.035, -0.45, -0.012], [0, -0.08, 0.064], [0, -0.46, 0.052]]), lac, null, null, [1.25, 1, 1.28]);
    add(Lg.lo, box(0.005, 0.27, 0.005), crim, [0, -0.27, 0.076], [0.03, 0, 0]);

    add(Lg.foot, hull([[0.04, 0, -0.07], [0.046, -0.1, -0.082], [0.046, 0.022, 0.03], [0.052, -0.1, 0.1], [0.042, -0.035, 0.12], [0, 0.04, -0.01]]), lacD);

    for (let i = 0; i < 6; i++) { const z = 0.2 + i * 0.17; add(saya, drum(0.013, 0.008, 8), dark, [0.0215, y(z), z]); add(saya, drum(0.006, 0.01, 6), crim, [0.022, y(z), z]); }
    for (let i = 0; i < 5; i++) { const z = 0.285 + i * 0.17; add(saya, box(0.004, 0.005, 0.07), moonG, [0.0215, y(z), z]); }
    add(katana, rodZ(0.056, 0.012, 6), gold, [0, 0, -0.008]);
    add(katana, rodZ(0.021, 0.36, 8), dark, [0, 0, -0.195], null, [0.78, 1, 1]);
    for (let i = 0; i < 6; i++) for (const s of [1, -1]) add(katana, new T.OctahedronGeometry(0.013, 0), cyan, [s * 0.0165, 0, -0.05 - i * 0.055], null, [0.3, 1, 1.3]);
    add(katana, rodZ(0.024, 0.035, 8), gold, [0, 0, -0.385], null, [0.8, 1, 1]);
    add(katana, rodZ(0.017, 0.045, 6), gold, [0, 0, 0.022], null, [0.5, 1.15, 1]);
    // the blade: the scabbard's own curve, the edge on the outside of it, six eyes along its flat
    const BL = LEN - 0.07, R = 18, pos = [], idx = [], edge = [];
    for (let i = 0; i <= R; i++) {
      const u = i / R, z = 0.02 + (BL - 0.02) * u, w = 0.036 - 0.009 * u, tip = Math.max(0, (u - 0.93) / 0.07), yy = y(z);
      const hw = (w / 2) * (1 - tip), th = 0.0045 * (1 - tip);
      pos.push(0, yy + hw - tip * w * 0.5, z, th, yy - hw * 0.3 - tip * w * 0.5, z, 0, yy - hw - tip * w * 0.5, z, -th, yy - hw * 0.3 - tip * w * 0.5, z);
      edge.push([0, yy + hw - tip * w * 0.5 + 0.0015, z]);
      if (i < R) for (let k = 0; k < 4; k++) { const a = i * 4 + k, b = i * 4 + ((k + 1) % 4), c = a + 4, d = b + 4; idx.push(a, c, b, b, c, d); }

    for (let i = 0; i < 6; i++) {
      const z = 0.2 + i * 0.165, e = grp(katana, [0, y(z) - 0.002, z]);
      for (const s of [1, -1]) { add(e, drum(0.0125, 0.003, 8), dark, [s * 0.0052, 0, 0]); add(e, drum(0.008, 0.004, 8), crim, [s * 0.0058, 0, 0]); }

    }
    add(saya, box(0.1, 0.022, 0.03), bone, [-0.055, 0.0, 0.13]);
  }

  // the scabbard hangs from the pelvis, fixed once from the standing pose
  {
    const hm = new T.Matrix4().makeRotationY(0.2).setPosition(0, 1.158, 0);
    const sd = v3(0.26, -0.62, -0.74).normalize(), left = v3(1, 0, 0);
    const x = left.clone().addScaledVector(sd, -left.dot(sd)).normalize(), yv = v3().crossVectors(sd, x);
    new T.Matrix4().makeBasis(x, yv, sd).setPosition(0.155, 1.2, 0.13).premultiply(hm.invert()).decompose(saya.position, saya.quaternion, saya.scale);

  }
  const sayaQ0 = saya.quaternion.clone(), ORDER = [2, 3, 0, 1, 4, 5];
  const _mS = new T.Matrix4(), _pS = v3(), _qS = new T.Quaternion(), _sc = v3();
  /**
   * Stand him in a pose. Feet are [worldX, y, sideLocal, yaw, pitch]; the rest is in his own frame (x = his left, z = forward).
   * The sword: `kD` metres drawn along the scabbard, and `kW` 0…1 blends that to a free blade held at `kG`, pointing `kDir`, its edge toward `kUp`.
   */
  function apply(p) {
    root.position.set(p.x, 0, p.z || 0);
    root.rotation.set(0, -Math.PI / 2 + (p.yaw || 0), 0);
    hips.position.set(p.hip[0], p.hip[1], p.hip[2]);
    hips.rotation.set(p.hipPitch || 0, p.hipYaw, p.hipRoll || 0, 'YXZ');
    waist.rotation.set(p.waist[0], p.waist[1], p.waist[2], 'YXZ');
    chest.rotation.set(p.chest || 0, 0, 0);
    neck.rotation.set(p.neck || 0, 0, 0);
    head.rotation.set(p.head[0], p.head[1], p.head[2] || 0, 'YXZ');
    maneP.rotation.set(p.mane || 0, 0, p.maneZ || 0);

    ORDER.forEach((e, k) => { const o = Math.min(1, Math.max(0, (p.eyes ?? 6) - k)); eyes[e].userData.iris.forEach((m) => { m.visible = o > 0.02; m.scale.set(o, o, 1); }); });
    bladeEyes.forEach((e, k) => { const o = Math.min(1, Math.max(0, (p.bEyes || 0) - k)); e.visible = o > 0.02; e.scale.setScalar(Math.max(0.01, o)); });
    root.updateWorldMatrix(true, true);
    const qR = root.getWorldQuaternion(new T.Quaternion());
    const P = (x, y, z) => root.localToWorld(v3(x, y, z));
    const Dn = (x, y, z) => v3(x, y, z).applyQuaternion(qR).normalize();
    const foot = (Lg, f, pole) => {
      ik2(Lg.up, Lg.lo, B.thigh, B.shin, P(f[2], f[1], p.x - f[0]), Dn(pole, 0, 1));
      setWorldQuat(Lg.foot, qR.clone().multiply(new T.Quaternion().setFromEuler(new T.Euler(f[4] || 0, f[3] || 0, 0, 'YXZ'))));
    };
    foot(legR, p.fR, p.kneeR); foot(legL, p.fL, p.kneeL);
    _mS.copy(saya.matrixWorld).multiply(new T.Matrix4().makeTranslation(0, 0, -(p.kD || 0))).decompose(_pS, _qS, _sc);
    if (p.kW > 0.001) {
      const z = Dn(p.kDir[0], p.kDir[1], p.kDir[2]), up = Dn(p.kUp[0], p.kUp[1], p.kUp[2]);
      const yv = up.addScaledVector(z, -up.dot(z)).normalize(), x = v3().crossVectors(yv, z);
      const qF = new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(x, yv, z));
      _pS.lerp(P(p.kG[0], p.kG[1], p.kG[2]).addScaledVector(z, -GR), p.kW);
      _qS.slerp(qF, p.kW);
    }
    katana.position.copy(_pS); katana.quaternion.copy(_qS); katana.updateMatrixWorld(true);
    // a hand on the hilt: reach the grip, turn the fist to the hilt's axis, then reach again with the wrist where that fist needs it
    const axis = v3(0, 0, 1).applyQuaternion(_qS);
    const grip = (A, gp, pole, ax) => {
      ik2(A.up, A.lo, B.upper, B.fore, gp, pole); orientGrip(A.hand, A.lo, ax);
      ik2(A.up, A.lo, B.upper, B.fore, gp.clone().addScaledVector(v3(0, 1, 0).applyQuaternion(A.hand.getWorldQuaternion(new T.Quaternion())), FIST_Y * HS), pole); orientGrip(A.hand, A.lo, ax);
    };
    grip(armR, katana.localToWorld(v3(0, 0, GR)), Dn(p.elbR[0], p.elbR[1], p.elbR[2]), axis);
    const lh = saya.localToWorld(v3(0.0, 0.0, 0.1)), w = p.hLw || 0;
    if (w > 0.001) lh.lerp(katana.localToWorld(v3(0, 0, GL)), w);
    grip(armL, lh, Dn(p.elbL[0], p.elbL[1], p.elbL[2]), w > 0.5 ? axis : v3(0, 0, 1).applyQuaternion(saya.getWorldQuaternion(new T.Quaternion())));
    root.updateWorldMatrix(true, true);
  }
  return { root, apply, B, eyes, katana, saya, parts: { hips, waist, chest, neck, head, armL, armR, legL, legR } };
}

// Sparks, crescents of light, flares, the shock ring. Everything is a pure function of time, so any frame can be drawn alone.
function buildFX(scene) {
  const fx = { bursts: [] };
  const MAX = 1800, pos = new Float32Array(MAX * 6), colr = new Float32Array(MAX * 6), hp = new Float32Array(MAX * 3), hc = new Float32Array(MAX * 3);
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(pos, 3)); geo.setAttribute('color', new T.BufferAttribute(colr, 3));
  const lines = new T.LineSegments(geo, new T.LineBasicMaterial({ vertexColors: true, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false, transparent: true }));
  const hgeo = new T.BufferGeometry();
  hgeo.setAttribute('position', new T.BufferAttribute(hp, 3)); hgeo.setAttribute('color', new T.BufferAttribute(hc, 3));
  const heads = new T.Points(hgeo, new T.PointsMaterial({ size: 0.035, sizeAttenuation: true, vertexColors: true, map: dotTexture([[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.5)'], [1, 'rgba(255,255,255,0)']], 32), blending: T.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false, transparent: true }));
  lines.frustumCulled = heads.frustumCulled = false;
  scene.add(lines, heads);
  /** o: origin, dir, spread, n, v [min,max], life [min,max], g, drag, c0/c1 colours, len (streak seconds), implode */
  fx.burst = (b) => {
    const r = rng(b.seed || fx.bursts.length + 1), parts = [], d = v3(...(b.dir || [0, 1, 0])).normalize();
    for (let i = 0; i < b.n; i++) {
      const u = v3(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1).normalize().multiplyScalar(b.spread ?? 1).add(d).normalize();
      parts.push({ v: u.multiplyScalar(lerpN(b.v[0], b.v[1], r() * r())), life: lerpN(b.life[0], b.life[1], r()), k: 0.6 + 0.8 * r() });
    }
    fx.bursts.push(Object.assign({ g: 7, drag: 1.6, len: 0.035, c0: [3, 2.6, 2.4], c1: [2.2, 0.5, 1.2] }, b, { parts }));
  };
  const lerpN = (a, b, t) => a + (b - a) * t;
  const at = (b, p, tau, out) => {
    if (b.implode) { const q = Math.pow(1 - tau / p.life, 2); out.set(b.o[0] + p.v.x * q * 0.12, b.o[1] + p.v.y * q * 0.12, b.o[2] + p.v.z * q * 0.12); return; }
    const e = (1 - Math.exp(-b.drag * tau)) / b.drag;
    out.set(b.o[0] + p.v.x * e, Math.max(0.015, b.o[1] + p.v.y * e - 0.5 * b.g * tau * tau), b.o[2] + p.v.z * e);
  };
  const a = v3(), c = v3();
  fx.sparks = (time) => {
    let n = 0;
    for (const b of fx.bursts) {
      const tau0 = time - b.t;
      if (tau0 <= 0 || tau0 > b.life[1] + 0.05) continue;
      for (const p of b.parts) {
        if (tau0 >= p.life || n >= MAX) continue;
        at(b, p, tau0, a); at(b, p, Math.max(0, tau0 - b.len), c);
        const f = Math.pow(1 - tau0 / p.life, 1.3) * p.k, m = tau0 / p.life;
        const cr = lerpN(b.c0[0], b.c1[0], m) * f, cg = lerpN(b.c0[1], b.c1[1], m) * f, cb = lerpN(b.c0[2], b.c1[2], m) * f;
        pos.set([a.x, a.y, a.z, c.x, c.y, c.z], n * 6); colr.set([cr, cg, cb, cr * 0.2, cg * 0.2, cb * 0.2], n * 6);
        hp.set([a.x, a.y, a.z], n * 3); hc.set([cr, cg, cb], n * 3);
        n++;
      }
    }
    geo.setDrawRange(0, n * 2); hgeo.setDrawRange(0, n);
    geo.attributes.position.needsUpdate = geo.attributes.color.needsUpdate = hgeo.attributes.position.needsUpdate = hgeo.attributes.color.needsUpdate = true;
  };

  // ---- crescents: the mark Luna's blade leaves
  const cg = (() => {
    const s = new T.Shape(), N = 28, A = 1.3;
    for (let i = 0; i <= N; i++) { const th = -A + (2 * A * i) / N; i ? s.lineTo(Math.cos(th), Math.sin(th)) : s.moveTo(Math.cos(th), Math.sin(th)); }
    for (let i = N; i >= 0; i--) { const th = -A + (2 * A * i) / N, r = 1 - 0.26 * Math.cos((th / A) * Math.PI / 2); s.lineTo(Math.cos(th) * r, Math.sin(th) * r); }
    const g = new T.ShapeGeometry(s, 1);
    g.translate(-0.85, 0, 0);
    return g;
  })();

  });
  composer.addPass(grade);

  const fx = buildFX(scene);
  const film = buildFilm({ scene, camera, hoplite, luna, fx, W, lights, grade, bloom });
  const DUR = EV.fadeEnd, FPS = 30;
  let now = 0, free = false, freeFov = 34, follow = null, lastS = null, controls = null;
  function setTime(t, cam) { now = Math.min(DUR, Math.max(0, t)); film.update(now, cam); composer.render(); }
  // where a fighter (or the middle of the two) stands at a moment of the film
  const subject = (who, t) => {
    const ta = Math.min(Math.max(0, t), EV.freeze), h = film.evalTrack(film.HT, ta), l = film.evalTrack(film.LT, ta);
    const H = v3(h.x, 1.05, h.z || 0), L = v3(l.x, 1.15, l.z || 0);
    return who === 'hoplite' ? H : who === 'luna' ? L : H.add(L).multiplyScalar(0.5);
  };
  // one frame with whichever camera is in charge: the film's, or the viewer's own
  function draw(t) {
    if (!free) { setTime(t); return; }
    t = Math.min(DUR, Math.max(0, t));
    if (follow) { const s = subject(follow, t); if (lastS) { const d = s.clone().sub(lastS); camera.position.add(d); controls.target.add(d); } lastS = s; }
    controls.update();
    const p = camera.position, g = controls.target;
    if (g.y < 0.05) { p.y += 0.05 - g.y; g.y = 0.05; }
    if (p.y < 0.1) p.y = 0.1; // never under the mirror floor
    setTime(t, [p.x, p.y, p.z, g.x, g.y, g.z, freeFov]);
  }
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); composer.setSize(w, h);
    camera.aspect = w / h; freeFov = w / h < 0.8 ? 56 : w / h < 1.25 ? 44 : 34;
    camera.updateProjectionMatrix();
    draw(now);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();
  window.__film = { setTime, EV, DUR, renderer, scene, camera, film, hoplite, luna };
  if (RENDER) return;

  // ---- the player: picture follows the sound's clock
  const $ = (id) => document.getElementById(id), btn = $('play'), bar = $('seek'), clock = $('clock');
  const B64 = $('audio-data').textContent.trim();
  let actx = null, abuf = null, src = null, playing = false, t0 = 0, wall0 = 0, rate = 1, aud = false;
  const fmt = (t) => t.toFixed(2).replace('.', ',') + ' с';
  const ui = () => { bar.value = String(now); clock.textContent = fmt(now) + ' / ' + fmt(DUR); };
  const press = (list, on) => list.forEach((b) => b.setAttribute('aria-pressed', String(on(b))));
  async function sound() {
    if (!B64 || abuf) return;
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const bin = atob(B64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    abuf = await new Promise((res, rej) => actx.decodeAudioData(u8.buffer, res, rej)).catch(() => null);
  }
  function stopSound() { if (src) { try { src.onended = null; src.stop(); } catch (e) {} src = null; } }
  const clockNow = () => (aud ? actx.currentTime : performance.now() / 1000);
  async function play() {
    if (now >= DUR - 0.05) { lastS = null; draw(0); }
    await sound();
    playing = true; btn.textContent = 'Пауза'; t0 = now; aud = !!abuf && rate === 1; // slowed down, the film runs silent
    if (aud) { if (actx.state === 'suspended') await actx.resume(); stopSound(); src = actx.createBufferSource(); src.buffer = abuf; src.connect(actx.destination); src.start(0, Math.min(now, abuf.duration - 0.01)); }
    wall0 = clockNow();
    requestAnimationFrame(loop);
  }
  function pause() { playing = false; btn.textContent = 'Смотреть'; stopSound(); }
  function loop() {
    if (!playing) return;
    const t = t0 + (clockNow() - wall0) * rate;
    draw(t); ui();
    if (t >= DUR) { pause(); return; }
    requestAnimationFrame(loop);
  }
  const seekTo = (t) => { const was = playing; if (was) pause(); draw(t); ui(); if (was) play(); };
  const step = (n) => { if (playing) pause(); draw((Math.round(now * FPS) + n) / FPS); ui(); };
  btn.addEventListener('click', () => (playing ? pause() : play()));
  bar.max = String(DUR);
  bar.addEventListener('input', () => seekTo(+bar.value));
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  const rates = [...document.querySelectorAll('#rates button')];
  rates.forEach((b) => b.addEventListener('click', () => { const was = playing; if (was) pause(); rate = +b.dataset.rate; press(rates, (x) => x === b); $('quiet').hidden = rate === 1; if (was) play(); }));

  // ---- the viewer's own camera: orbit, zoom and pan at any moment of the film, playing or paused
  controls = new T.OrbitControls(camera, canvas);
  controls.enabled = false; controls.enableDamping = true; controls.dampingFactor = 0.12; controls.screenSpacePanning = true;
  controls.minDistance = 0.5; controls.maxDistance = 26; controls.maxPolarAngle = 89.4 * D; controls.zoomSpeed = 0.9;
  let queued = false;
  const tick = () => { queued = false; if (!playing && free) draw(now); };
  controls.addEventListener('change', () => { if (!queued && !playing && free) { queued = true; requestAnimationFrame(tick); } });
  controls.addEventListener('start', () => $('hint').classList.add('gone'));
  const views = [...document.querySelectorAll('#views button')];
  function setFree(on) {
    if (on === free) return;
    if (on) {
      // start from exactly what the film's camera shows at this moment
      const p = camera.position.clone(), d = camera.getWorldDirection(v3()), f0 = camera.fov;
      let dist = Math.abs(d.z) > 0.05 ? -p.z / d.z : -1; // the fighters stand on the line z = 0
      if (!(dist > 1 && dist < 14)) dist = Math.min(14, Math.max(1, p.distanceTo(subject('both', now))));
      const g = p.clone().addScaledVector(d, dist);
      free = film.free = true; document.body.classList.add('free'); $('views').hidden = false; $('hint').hidden = false; $('hint').classList.remove('gone');
      const w = canvas.clientWidth, h = canvas.clientHeight; if (w && h) freeFov = w / h < 0.8 ? 56 : w / h < 1.25 ? 44 : 34;
      controls.target.copy(g); camera.position.copy(g).add(p.sub(g).multiplyScalar(Math.tan((f0 * D) / 2) / Math.tan((freeFov * D) / 2)));
      controls.enabled = true; follow = null; lastS = null; press(views, () => false);
    } else { free = film.free = false; controls.enabled = false; document.body.classList.remove('free'); $('views').hidden = true; $('hint').hidden = true; }
    $('cam-film').setAttribute('aria-pressed', String(!free)); $('cam-free').setAttribute('aria-pressed', String(free));
    resize(); draw(now);
  }
  // a ready angle that then travels with its fighter; pressing it again leaves the camera standing where it is
  function setView(name) {
    if (follow && views.find((b) => b.dataset.view === name).getAttribute('aria-pressed') === 'true') { follow = null; lastS = null; press(views, () => false); return; }
    const who = name === 'top' ? 'both' : name, s = subject(who, now), sep = Math.abs(subject('luna', now).x - subject('hoplite', now).x);
    const V = { both: { o: [0, 0.1, 1], span: sep / 2 + 1.3 }, hoplite: { o: [0.55, 0.12, 1], span: 1.35 }, luna: { o: [-0.55, 0.12, 1], span: 1.35 }, top: { o: [0, 1, 0.3], span: sep / 2 + 1.6 } }[name];
    const th = Math.tan((freeFov * D) / 2), dist = Math.min(18, Math.max(1.5, V.span / (th * camera.aspect), 1.3 / th));
    controls.target.copy(s); camera.position.copy(s).addScaledVector(v3(V.o[0], V.o[1], V.o[2]).normalize(), dist);
    follow = who; lastS = s; press(views, (b) => b.dataset.view === name);
    draw(now);
  }
  $('cam-film').addEventListener('click', () => setFree(false));
  $('cam-free').addEventListener('click', () => setFree(true));
  views.forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const onButton = e.target && e.target.tagName === 'BUTTON';
    if (e.code === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.code === 'Space' && !onButton) { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === 'KeyC') setFree(!free);
  });
  Object.assign(window.__film, { setFree, setView, draw });
  draw(1.0); ui();
})();

</script>
</body>
</html>
